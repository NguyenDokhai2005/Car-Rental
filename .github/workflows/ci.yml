name: CI

# Chạy khi mở hoặc cập nhật Pull Request, và khi mã vào main.
# Chỉ đọc mã (không cần quyền ghi), nên PR từ nhánh lạ cũng không làm hại được repo.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Có commit mới trên cùng một nhánh thì hủy lần chạy cũ, đỡ tốn phút chạy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.9"   # khớp với Dockerfile

jobs:
  api:
    name: API (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # PostgreSQL thật cho test e2e: cần btree_gist và ràng buộc EXCLUDE nên không thể thay bằng giả lập.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test tự tạo database carrental_test và áp dụng migration (xem api/test/global-setup.ts)
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/carrental_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter api...
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api typecheck
      - run: pnpm --filter api lint
      - run: pnpm --filter api test
      - run: pnpm --filter api build

  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter web...
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      # Cần Internet: next/font tải font Be Vietnam Pro từ Google lúc build
      - run: pnpm --filter web build

  docker:
    name: Docker (build image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Chỉ build để chắc Dockerfile còn chạy được, không đẩy image đi đâu (push: false).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
