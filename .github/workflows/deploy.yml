name: Deploy

# Tự đưa bản mới lên CẢ HAI máy chủ SAU KHI CI xanh trên nhánh main:
#   - máy ảo VMware tại nhà   (runner nhãn carrental-vm,    environment production)
#   - server cloud            (runner nhãn carrental-cloud, environment production-cloud)
#
# Mỗi máy chủ chạy một self-hosted runner. Runner tự kết nối ra GitHub nên không phải mở cổng nào cho GitHub và không
# phải cất khóa SSH trên GitHub (máy ảo còn nằm sau NAT nên GitHub không SSH vào được).
#
# AN TOÀN (repo công khai, runner chạy mã ngay trên máy chủ của bạn):
#   - Chỉ chạy khi CI vừa chạy cho một lần PUSH vào main trong chính repo này.
#   - Không bao giờ chạy cho Pull Request: các job CI của PR chạy trên máy do GitHub cấp (ubuntu-latest).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy lên ${{ matrix.name }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      # Hai máy chủ độc lập: một máy lỗi hoặc đang tắt (máy ảo tắt theo máy tính) không được hủy lần deploy của máy kia.
      fail-fast: false
      matrix:
        include:
          - name: máy ảo VMware
            runner: carrental-vm
            environment: production
          - name: server cloud
            runner: carrental-cloud
            environment: production-cloud
    runs-on: [self-hosted, linux, "${{ matrix.runner }}"]
    timeout-minutes: 30
    # Có thể bật "Required reviewers" riêng cho từng environment để mỗi lần deploy phải chờ bạn bấm duyệt (xem docs/ci-cd.md).
    environment: ${{ matrix.environment }}
    # Trên MỖI máy chủ: deploy lần lượt, không cái nào chen vào cái nào, không hủy giữa chừng một lần đang chạy.
    # Khóa theo từng máy (không khóa chung cả workflow) để một máy đang tắt không giữ chân lần deploy của máy còn lại.
    concurrency:
      group: deploy-${{ matrix.runner }}
      cancel-in-progress: false
    steps:
      # Lấy đúng commit đã được CI kiểm tra, không phải "main mới nhất" (tránh deploy mã chưa qua CI).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy
        run: bash infra/scripts/ci-deploy.sh
